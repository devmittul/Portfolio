<!DOCTYPE html>
<!-- 
DEBUG VERSION
This is a special version for debugging the portfolio website.
It loads index.html in an iframe with all animations disabled.
-->
<html lang="en">
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Debug Portfolio View</title> 
    <link rel="stylesheet" href="styles.css"> 
    <style> 
        body { display: block; visibility: visible; } 
        .greeting, .name, .profession, .description, .cta-buttons, 
        .profile-image, .orbit-element, .skill-progress, 
        .about-card, .stat-item, .project-card, 
        .contact-card, .contact-form { opacity: 1 !important; } 
    </style> 
</head> 
<body> 
    <div class="noise-overlay"></div> 
    <iframe src="index.html" style="width:100%; height:100vh; border:none; position:absolute; top:0; left:0; right:0; bottom:0;"></iframe>
</body> 
</html>
